# Build VM for thinkpad-600x-buildroot (instance `br2`).
# The host home is deliberately NOT mounted: copy the tree into the VM with
# tar + `limactl copy` instead — see the copy-in recipe in docs/BUILD.md.
# Matches the live instance (`limactl list`, ~/.lima/br2/lima.yaml).
vmType: vz
arch: aarch64
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
cpus: 10
memory: "16GiB"
disk: "121GiB"
ssh:
  loadDotSSHPubKeys: true
containerd:
  system: false
  user: false