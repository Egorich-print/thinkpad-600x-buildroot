# btop defaults for the ThinkPad 600X.
#
# The NeoMagic 256ZX under the legacy Xorg DDX (no DRM/KMS) plus the CDE bitmap
# fonts do not handle 24-bit truecolor or braille graph symbols well - btop's
# default rendering comes out garbled ("--force-utf" only makes it worse).
# tty mode switches to 16 colours and ANSI graph symbols, which renders
# correctly here.  A slower update interval keeps the Pentium III happy.
tty_mode = True
graph_symbol = "tty"
update_ms = 2000
