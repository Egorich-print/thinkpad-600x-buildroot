# Xorg config for the ThinkPad 600X (NeoMagic 256ZX) and QEMU.
#
# Video: no Driver is forced, so Xorg auto-detects the GPU
#   * real 600X  -> xf86-video-neomagic (direct hardware, no KMS)
#   * QEMU       -> modesetting (bochs-drm) / fbdev / vesa
#
# Input: this image has no udev, so Xorg cannot hot-detect input and
# xf86-input-evdev (which needs libudev) is unavailable.  Use the classic
# mouse/keyboard drivers with fixed device nodes:
#   * kbd    -> the console/PS2 keyboard
#   * mouse  -> /dev/input/mice (PS/2 TrackPoint; CONFIG_INPUT_MOUSEDEV)
#
# The legacy DDX drivers (neomagic/vesa/fbdev) reference symbols in helper
# modules (vgahw/int10/fbdevhw/shadow/shadowfb) that they dlopen lazily.  With a
# full-RELRO toolchain (-Wl,-z,now) that lazy dlopen fails, so pre-load them.
# See docs/X11.md.
Section "Module"
    Load "vgahw"
    Load "int10"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "kbd"
    Option     "XkbModel" "pc102"
    Option     "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "mouse"
    Option     "Protocol" "PS/2"
    Option     "Device" "/dev/input/mice"
    Option     "Emulate3Buttons" "true"
EndSection

Section "Device"
    Identifier "Card0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Card0"
    # 16bpp: the NeoMagic 256ZX has 4 MB VRAM (1024x768x16 fits), and 8bpp is
    # too few colours for modern terminal apps (btop etc.).  Avoid 24bpp, which
    # the legacy DDX handles poorly.
    DefaultDepth 16
EndSection

Section "ServerLayout"
    Identifier  "Layout0"
    Screen      "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0"    "CorePointer"
EndSection
