# Xorg config for the ThinkPad 600X (NeoMagic 256ZX) and QEMU.
#
# Video: no Driver is forced, so Xorg auto-detects the GPU
#   * real 600X  -> xf86-video-neomagic (direct hardware, no KMS)
#   * QEMU       -> modesetting (bochs-drm) / fbdev / vesa
#
# Input: this system has no udev, so Xorg cannot hot-detect input devices and
# only the evdev driver is available.  Bind the PS/2 keyboard and TrackPoint
# explicitly.  /dev/input/event0 is the AT keyboard; the TrackPoint/mouse is
# the next event device (event1 on both the 600X and QEMU).
#
# The legacy DDX drivers (neomagic/vesa/fbdev) reference symbols in helper
# modules (vgahw/int10/fbdevhw/shadow/shadowfb) that they dlopen lazily.  With a
# full-RELRO toolchain (-Wl,-z,now) that lazy dlopen fails, so pre-load them.
# See docs/X11.md.
Section "Module"
    Load "vgahw"
    Load "int10"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
    Option     "Emulate3Buttons" "true"
EndSection

Section "Device"
    Identifier "Card0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Card0"
EndSection

Section "ServerLayout"
    Identifier  "Layout0"
    Screen      "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0"    "CorePointer"
EndSection
