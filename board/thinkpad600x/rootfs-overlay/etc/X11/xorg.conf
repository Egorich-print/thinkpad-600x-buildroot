# Xorg config for the ThinkPad 600X (NeoMagic) + QEMU (modesetting/bochs).
#
# The legacy DDX drivers (neomagic/vesa/fbdev) reference symbols in the helper
# modules (vgahw/int10/fbdevhw/shadow) which they lazy-load; pre-load them here
# so the symbols are already in dynamic scope when the driver is dlopen'd.
# (See docs/CDE.md / docs/HARDWARE.md — root cause is full-RELRO -z now.)
Section "Module"
    Load "vgahw"
    Load "int10"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "modesetting"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen "Screen0"
EndSection