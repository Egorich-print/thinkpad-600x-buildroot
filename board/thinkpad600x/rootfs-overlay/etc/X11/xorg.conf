# Xorg config for the ThinkPad 600X (NeoMagic 256ZX) and QEMU.
#
# No Device/Screen section is forced: Xorg auto-detects the GPU, which gives
#   * real 600X  -> xf86-video-neomagic (direct hardware, no KMS)
#   * QEMU       -> modesetting (bochs-drm) / fbdev / vesa
#
# The legacy DDX drivers (neomagic/vesa/fbdev) reference symbols in helper
# modules (vgahw/int10/fbdevhw/shadow/shadowfb) that they dlopen lazily.  With a
# full-RELRO toolchain (-Wl,-z,now, Buildroot BR2_RELRO_FULL) the lazy dlopen
# fails with "undefined symbol", so pre-load the helpers into the server's
# global dynamic scope here.  See docs/X11.md.
Section "Module"
    Load "vgahw"
    Load "int10"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection
